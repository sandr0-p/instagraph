services:
  development:
    build:
      context: .
    working_dir: /development
    volumes:
      - "..:/development"
    command: sleep infinity
  neo4j:
    image: neo4j:5.26-community-ubi10
    container_name: instagraph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474" # Neo4j Browser / HTTP
      - "7687:7687" # Bolt protocol used by backend apps
    environment:
      NEO4J_AUTH: neo4j/Password1234
      # Optional but useful for local development
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - ../neo4j/data:/data
      - ../neo4j/logs:/logs
      - ../neo4j/import:/var/lib/neo4j/import
      - ../neo4j/plugins:/plugins